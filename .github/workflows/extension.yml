name: extension

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      DELTA_DOWNLOAD_BASE: https://github.com/jmoraispk/delta-review/releases/latest/download
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # A tag that disagrees with the manifest ships the wrong version. AMO
      # rejects a duplicate version only after consuming the signing
      # submission, and even a successful run would publish update manifests
      # advertising the old version, so no installed browser would ever see the
      # release. Checking before the build makes a mismatch cost nothing.
      - name: Check the manifest version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('web/src/extension/manifest.base.json', 'utf8')).version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::web/src/extension/manifest.base.json says $version, but the tag is $GITHUB_REF_NAME. Set the manifest version to ${GITHUB_REF_NAME#v} and re-tag."
            exit 1
          fi

      - run: npm ci --prefix web
      - run: npm test --prefix web -- --run
      - run: npm run build:extension --prefix web

      - name: Zip the Chrome build
        run: cd web/dist-extension/chrome && zip -r ../../../delta-review-chrome.zip .

      - name: Pack the CRX
        run: |
          echo "$CRX_PRIVATE_KEY" > /tmp/key.pem
          npx --yes crx3 --keyPath /tmp/key.pem \
            --crxPath delta-review.crx web/dist-extension/chrome
          rm /tmp/key.pem
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}

      - name: Sign the Firefox XPI
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          npx --yes web-ext sign \
            --source-dir web/dist-extension/firefox \
            --artifacts-dir dist-xpi \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}

      # web-ext names its output delta_review-<version>.xpi. The install page
      # links one stable URL that people paste into chat, so give the artifact
      # a version-free name and keep releases/latest/download/delta-review.xpi
      # resolving across every future release.
      - name: Name the XPI for a stable download link
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          shopt -s nullglob
          xpis=(dist-xpi/*.xpi)
          if [ ${#xpis[@]} -eq 0 ]; then
            echo "::error::web-ext signed nothing: no .xpi in dist-xpi."
            exit 1
          fi
          # Renaming a glob that matched twice would fail with "target is not a
          # directory"; take the first match and say which one was published.
          echo "Publishing ${xpis[0]} as delta-review.xpi"
          mv "${xpis[0]}" delta-review.xpi

      - name: Build update manifests
        run: node web/scripts/make-update-manifests.mjs

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # Defaults to false, which would publish a green release missing, say,
          # updates.xml — after which installed browsers quietly stop updating
          # and nothing anywhere reports a problem.
          fail_on_unmatched_files: true
          files: |
            delta-review-chrome.zip
            delta-review.crx
            delta-review.xpi
            web/dist-extension/updates/updates.xml
            web/dist-extension/updates/updates.json
